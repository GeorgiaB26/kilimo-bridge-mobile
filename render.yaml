# Render Blueprint — Kilimo Bridge API
services:
  - type: web
    name: kilimo-bridge-api
    runtime: node
    rootDir: backend
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Must stay "false" in production: "true" enables the fixed OTP 123456 and /auth/dev-login.
      # Pilot login is for local development only (NODE_ENV != production enables it already).
      - key: PILOT_OTP
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
